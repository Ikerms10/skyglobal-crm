<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#1C1209"/>
  <!-- Globe circle -->
  <circle cx="32" cy="34" r="16" fill="none" stroke="#D4A853" stroke-width="1.8"/>
  <!-- Equator line -->
  <line x1="16" y1="34" x2="48" y2="34" stroke="#D4A853" stroke-width="1.4"/>
  <!-- Meridian arc -->
  <path d="M32 18 Q40 26 40 34 Q40 42 32 50" fill="none" stroke="#D4A853" stroke-width="1.4"/>
  <!-- Sky arc above globe -->
  <path d="M20 22 Q32 10 44 22" fill="none" stroke="#D4A853" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="26" cy="14" r="1.2" fill="#D4A853"/>
  <circle cx="32" cy="11" r="1.5" fill="#D4A853"/>
  <circle cx="38" cy="14" r="1.2" fill="#D4A853"/>
</svg>
